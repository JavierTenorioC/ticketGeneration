<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tickets</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#0f6e56;--acx:#fff;--bd:#e2e2dc;--warn:#b45309;--wbg:#fef3c7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151514;--card:#222220;--tx:#f0f0ec;--mut:#9a9a93;--ac:#3ec9a0;--acx:#08241c;--bd:#38382f;--warn:#fbbf24;--wbg:#3a2f0b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:auto;padding:12px}
h1{font-size:20px;margin:4px 0 2px}small,.m{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}
button,input{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:10px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p,.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:6px;align-items:center}.row>*{min-width:0}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.tot div{display:flex;justify-content:space-between;padding:2px 0}.tot .g{font-size:20px;font-weight:700}
.b{display:inline-block;font-size:11px;font-weight:700;background:var(--wbg);color:var(--warn);border-radius:6px;padding:1px 6px;margin-left:6px}
.ban{background:var(--wbg);color:var(--warn);padding:8px 10px;border-radius:10px;margin:8px 0}
textarea{width:100%;height:180px;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px}
.hide{display:none}#qr svg{width:220px;height:220px;display:block;margin:8px auto;background:#fff;padding:6px;border-radius:8px}
</style></head><body>
<h1>Tickets</h1><small id="dev"></small>
<div class="tabs"><button data-t="n" class="on">Nuevo</button><button data-t="h">Historial</button><button data-t="x">Exportar</button></div>

<section id="n">
<div id="ban" class="ban hide"></div>
<div class="card"><div class="row"><input id="nm" placeholder="Artículo" style="flex:2"><input id="pr" type="number" inputmode="decimal" placeholder="Precio" style="flex:1"><input id="qt" type="number" inputmode="numeric" value="1" style="width:56px"></div>
<button class="p" id="add" style="width:100%;margin-top:8px">Agregar artículo</button></div>
<div class="card"><div id="items"></div>
<div class="tot" style="margin-top:8px"><div><span>Total de artículos</span><b id="u">0</b></div><div><span>Subtotal</span><b id="s"></b></div>
<div><span>IVA <input id="iva" type="number" value="16" style="width:60px;padding:4px"> %</span><b id="t"></b></div><div class="g"><span>Total</span><span id="g"></span></div></div></div>
<div class="row"><button id="clr" style="flex:1">Limpiar</button><button class="p" id="save" style="flex:2">Guardar ticket</button></div>
</section>

<section id="h" class="hide"><div id="list"></div></section>

<section id="x" class="hide"><div class="card"><p class="m">Copia los datos de este dispositivo para consolidarlos con los de los demás equipos. Cada fila incluye el ID del dispositivo y la marca de edición.</p>
<div class="row"><button id="ecsv" style="flex:1">CSV</button><button id="ejson" style="flex:1">JSON</button></div>
<textarea id="out" readonly></textarea><button class="p" id="cp" style="width:100%;margin-top:8px">Copiar</button></div></section>

<div id="det" class="card hide"></div>
<script>
const $=id=>document.getElementById(id),mx=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"});
let S={dev:null,name:"",seq:0,tickets:[]},draft=[],editing=null;
function load(){try{const r=localStorage.getItem("tk_v1");if(r)S=JSON.parse(r)}catch(e){}
if(!S.dev){S.dev=Math.random().toString(36).slice(2,6).toUpperCase();S.name="Equipo "+S.dev;persist()}}
function persist(){try{localStorage.setItem("tk_v1",JSON.stringify(S))}catch(e){alert("No se pudo guardar en el dispositivo")}}
const r2=n=>Math.round(n*100)/100;
function calc(items,iva){const u=items.reduce((a,i)=>a+i.q,0),s=r2(items.reduce((a,i)=>a+i.p*i.q,0)),t=r2(s*iva/100);return{u,s,t,g:r2(s+t)}}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function draw(){const c=calc(draft,+$("iva").value||0);
$("items").innerHTML=draft.length?draft.map((i,k)=>`<div class="it"><div>${esc(i.n)}<br><small>${i.q} × ${mx.format(i.p)}</small></div><div><b>${mx.format(i.p*i.q)}</b> <button data-d="${k}" style="padding:2px 8px">✕</button></div></div>`).join(""):'<p class="m">Aún no hay artículos.</p>';
$("u").textContent=c.u;$("s").textContent=mx.format(c.s);$("t").textContent=mx.format(c.t);$("g").textContent=mx.format(c.g);
const b=$("ban");if(editing){b.classList.remove("hide");b.textContent="Editando "+editing.id+". Al guardar se marcará como EDITADO."}else b.classList.add("hide")}
$("add").onclick=()=>{const n=$("nm").value.trim(),p=parseFloat($("pr").value),q=parseInt($("qt").value);
if(!n||!(p>=0)||!(q>0))return alert("Revisa nombre, precio y cantidad");draft.push({n,p,q});$("nm").value="";$("pr").value="";$("qt").value=1;draw();$("nm").focus()};
$("items").onclick=e=>{const k=e.target.dataset.d;if(k!==undefined){draft.splice(k,1);draw()}};
$("iva").oninput=draw;
$("clr").onclick=()=>{draft=[];editing=null;draw()};
$("save").onclick=()=>{if(!draft.length)return alert("Agrega al menos un artículo");
const iva=+$("iva").value||0,c=calc(draft,iva),now=new Date().toISOString();
if(editing){const t=S.tickets.find(x=>x.id===editing.id);t.edits.push({at:now,prevTotal:t.total});
Object.assign(t,{items:draft,iva,subtotal:c.s,tax:c.t,total:c.g,units:c.u,updated:now,edited:true})}
else{S.seq++;S.tickets.push({id:S.dev+"-"+String(S.seq).padStart(5,"0"),device:S.dev,deviceName:S.name,created:now,updated:now,items:draft,iva,subtotal:c.s,tax:c.t,total:c.g,units:c.u,edited:false,edits:[]})}
persist();draft=[];editing=null;draw();tab("h")};
function list(){const L=[...S.tickets].reverse();$("list").innerHTML=L.length?L.map(t=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${t.id}${t.edited?'<span class="b">EDITADO</span>':""}</b><b>${mx.format(t.total)}</b></div>
<small>${new Date(t.updated).toLocaleString("es-MX")} · ${t.units} artículos</small><div class="row" style="margin-top:8px"><button data-v="${t.id}" style="flex:1">Ver / QR</button><button data-e="${t.id}" style="flex:1">Editar</button></div></div>`).join(""):'<p class="m">Sin tickets guardados.</p>'}
$("list").onclick=e=>{const v=e.target.dataset.v,ed=e.target.dataset.e;
if(ed){const t=S.tickets.find(x=>x.id===ed);editing=t;draft=t.items.map(i=>({...i}));$("iva").value=t.iva;tab("n");draw()}
if(v){const t=S.tickets.find(x=>x.id===v);let qr="";try{const q=qrcode(0,"M");q.addData(JSON.stringify({id:t.id,t:t.updated,e:t.edited?1:0,i:t.items.map(i=>[i.n,i.p,i.q]),iva:t.iva,g:t.total}));q.make();qr=q.createSvgTag(4)}catch(x){qr="<p class='m'>Ticket muy grande para QR</p>"}
const d=$("det");d.classList.remove("hide");d.innerHTML=`<b>${t.id}</b>${t.edited?'<span class="b">EDITADO</span>':""}<br><small>${t.deviceName} · creado ${new Date(t.created).toLocaleString("es-MX")}</small>
${t.items.map(i=>`<div class="it"><span>${esc(i.n)} <small>${i.q} × ${mx.format(i.p)}</small></span><b>${mx.format(i.p*i.q)}</b></div>`).join("")}
<div class="tot"><div><span>Artículos</span><b>${t.units}</b></div><div><span>Subtotal</span><b>${mx.format(t.subtotal)}</b></div><div><span>IVA ${t.iva}%</span><b>${mx.format(t.tax)}</b></div><div class="g"><span>Total</span><span>${mx.format(t.total)}</span></div></div>
${t.edits.length?`<small>Ediciones: ${t.edits.length} (última ${new Date(t.edits.at(-1).at).toLocaleString("es-MX")})</small>`:""}<div id="qr">${qr}</div><button id="cl" style="width:100%">Cerrar</button>`;
$("cl").onclick=()=>d.classList.add("hide");d.scrollIntoView()}};
function csv(){const h="ticket_id,dispositivo_id,dispositivo,creado,actualizado,editado,num_ediciones,articulos,subtotal,iva_pct,iva,total,detalle";
return [h,...S.tickets.map(t=>[t.id,t.device,t.deviceName,t.created,t.updated,t.edited?"SI":"NO",t.edits.length,t.units,t.subtotal,t.iva,t.tax,t.total,t.items.map(i=>`${i.n} x${i.q} @${i.p}`).join(" | ")].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","))].join("\n")}
$("ecsv").onclick=()=>$("out").value=csv();$("ejson").onclick=()=>$("out").value=JSON.stringify(S.tickets,null,1);
$("cp").onclick=async()=>{const o=$("out");o.select();try{await navigator.clipboard.writeText(o.value);$("cp").textContent="¡Copiado!"}catch(e){document.execCommand("copy")}setTimeout(()=>$("cp").textContent="Copiar",1500)};
function tab(t){["n","h","x"].forEach(k=>$(k).classList.toggle("hide",k!==t));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("det").classList.add("hide");if(t==="h")list();if(t==="x")$("out").value=csv()}
document.querySelector(".tabs").onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t)};
load();$("dev").textContent=S.name+" · ID "+S.dev;draw();
</script></body></html>
