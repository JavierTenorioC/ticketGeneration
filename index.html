<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tickets</title>
<link rel="manifest" href="manifest.json">
<script src="qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#0f6e56;--acx:#fff;--bd:#e2e2dc;--warn:#b45309;--wbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151514;--card:#222220;--tx:#f0f0ec;--mut:#9a9a93;--ac:#3ec9a0;--acx:#08241c;--bd:#38382f;--warn:#fbbf24;--wbg:#3a2f0b}}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;padding:12px}
h1{font-size:20px;margin:4px 0 2px}small,.m{color:var(--mut);font-size:13px}
.tabs,.seg{display:flex;gap:6px;margin:10px 0}.tabs button,.seg button{flex:1}
button,input,select{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:10px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p,.on{background:var(--ac)!important;color:var(--acx)!important;border-color:var(--ac)!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:6px;align-items:center}.row>*{min-width:0}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.tot div{display:flex;justify-content:space-between;padding:2px 0}.tot .g{font-size:20px;font-weight:700}
.b{display:inline-block;font-size:11px;font-weight:700;background:var(--wbg);color:var(--warn);border-radius:6px;padding:1px 6px;margin-left:6px}
.ban{background:var(--wbg);color:var(--warn);padding:8px 10px;border-radius:10px;margin:8px 0}
.res button{display:block;width:100%;text-align:left;margin-top:4px}
textarea{width:100%;height:140px;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px}
table.x{width:100%;border-collapse:collapse;font-size:14px}
.x th,.x td{border:1px solid var(--bd);padding:6px 5px;vertical-align:top}
.x th{background:var(--bd);font-size:12px;text-align:left}
.x .r{text-align:right;white-space:nowrap}.x .c{text-align:center}
.x tbody tr:nth-child(even){background:var(--bg)}.x tr.sl td{background:var(--wbg)}
.x tfoot td{font-weight:600;background:var(--bg)}.x tfoot .g td{font-size:17px}
.bar{display:flex;gap:6px;margin-top:8px}.bar button{flex:1;padding:8px 2px}
.hide{display:none}#qr svg{width:220px;height:220px;display:block;margin:8px auto;background:#fff;padding:6px;border-radius:8px}
input,select{width:100%}
</style></head><body>
<h1>Tickets</h1><small id="dev"></small><br><small id="cat"></small>
<div class="tabs"><button data-t="n" class="on">Nuevo</button><button data-t="h">Historial</button><button data-t="x">Exportar</button></div>

<section id="n">
<div class="card"><small>Vendedor</small><input id="sel" placeholder="Nombre del vendedor" autocomplete="name"></div>
<div id="ban" class="ban hide"></div>
<div class="card">
<div class="seg" style="margin-top:0"><button id="mc" class="on">Catálogo</button><button id="mm">Artículo libre</button></div>
<div id="catp"><input id="q" placeholder="Buscar producto o código" autocomplete="off"><div id="res" class="res"></div>
<div id="pick" class="hide" style="margin-top:8px"><b id="pn"></b><select id="pres" style="margin-top:6px"></select></div></div>
<div id="manp" class="hide"><input id="mn" placeholder="Nombre del artículo"></div>
<div class="row" style="margin-top:8px"><input id="pr" type="number" inputmode="decimal" placeholder="Precio" step="0.01"><input id="qt" type="number" inputmode="numeric" value="1" min="1"></div>
<input id="ds" placeholder="Descripción del artículo (opcional)" style="margin-top:8px">
<button class="p" id="add" style="width:100%;margin-top:8px">Agregar al ticket</button></div>
<div class="card" style="padding:8px"><div id="items"></div>
<div id="bar" class="bar hide"><button id="bm">−1</button><button id="bp">+1</button><button id="bd">✎ Nota</button><button id="bx">Quitar</button></div></div>
<div class="card"><small>Descripción del ticket (opcional)</small><input id="desc" placeholder="Cliente, notas, entrega..."></div>
<div class="row"><button id="clr" style="flex:1">Limpiar</button><button class="p" id="save" style="flex:2">Guardar ticket</button></div>
</section>

<section id="h" class="hide"><div id="list"></div></section>

<section id="x" class="hide"><div class="card"><p class="m">Un renglón por artículo, listo para analizar en Excel o Python.</p>
<select id="rng"><option value="all">Todos los tickets</option><option value="today">Solo los de hoy</option></select>
<div class="row" style="margin-top:8px"><button class="p" id="dl" style="flex:1">CSV</button><button class="p" id="dj" style="flex:1">JSON</button><button id="sh" style="flex:1">Compartir</button></div>
<textarea id="out" readonly style="margin-top:8px"></textarea><button id="cp" style="width:100%;margin-top:8px">Copiar texto</button></div></section>

<div id="det" class="card hide"></div>
<script>
const $=id=>document.getElementById(id),mx=new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"});
let S={dev:null,name:"",seq:0,tickets:[]},cat={v:"",productos:[]},draft=[],editing=null,sel=null,manual=false;
const r2=n=>Math.round(n*100)/100,esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function load(){try{const r=localStorage.getItem("tk_v1");if(r)S=JSON.parse(r)}catch(e){}
if(!S.dev){S.dev=Math.random().toString(36).slice(2,6).toUpperCase();S.name="Equipo "+S.dev;persist()}
S.tickets.forEach(t=>{t.items.forEach(i=>{i.u=i.u||"pieza";i.f=i.f||1;i.pid=i.pid||"LIBRE"});if(t.pieces==null)t.pieces=t.items.reduce((a,i)=>a+i.q*i.f,0)});
try{const c=localStorage.getItem("tk_cat");if(c)cat=JSON.parse(c)}catch(e){}}
function persist(){try{localStorage.setItem("tk_v1",JSON.stringify(S))}catch(e){alert("No se pudo guardar en el dispositivo")}}
async function loadCat(){try{const r=await fetch("productos.json",{cache:"no-cache"});if(r.ok){const j=await r.json();cat={v:j.version,productos:j.productos||[]};try{localStorage.setItem("tk_cat",JSON.stringify(cat))}catch(e){}}}catch(e){}
$("cat").textContent=cat.productos.length?"Catálogo "+cat.v+" · "+cat.productos.length+" productos":"Sin catálogo cargado: usa Artículo libre";search()}
function calc(items){return{u:items.reduce((a,i)=>a+i.q,0),pz:items.reduce((a,i)=>a+i.q*i.f,0),g:r2(items.reduce((a,i)=>a+i.p*i.q,0))}}
const unit=i=>i.q===1?i.u:i.u+"s";
function search(){const q=norm($("q").value);const r=cat.productos.filter(p=>p.activo!==false&&norm(p.nombre+" "+p.id).includes(q)).slice(0,8);
$("res").innerHTML=r.map(p=>`<button data-p="${esc(p.id)}">${esc(p.nombre)} <small>${esc(p.id)}</small></button>`).join("")||'<p class="m">Sin resultados.</p>'}
$("q").oninput=search;
$("res").onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=cat.productos.find(p=>p.id===b.dataset.p);
$("pn").textContent=sel.nombre;$("pres").innerHTML=sel.presentaciones.map((x,k)=>`<option value="${k}">${esc(x.unidad)} (${x.factor} pz) · ${mx.format(x.precio)}</option>`).join("");
$("pick").classList.remove("hide");$("res").innerHTML="";$("q").value="";setPr()};
function setPr(){if(sel)$("pr").value=sel.presentaciones[+$("pres").value].precio}
$("pres").onchange=setPr;
function mode(m){manual=m;sel=null;$("mc").classList.toggle("on",!m);$("mm").classList.toggle("on",m);$("catp").classList.toggle("hide",m);$("manp").classList.toggle("hide",!m);$("pick").classList.add("hide");$("pr").value="";if(!m)search()}
$("mc").onclick=()=>mode(false);$("mm").onclick=()=>mode(true);
$("add").onclick=()=>{const p=parseFloat($("pr").value),q=parseInt($("qt").value),d=$("ds").value.trim();if(!(p>=0)||!(q>0))return alert("Revisa precio y cantidad");
if(manual){const n=$("mn").value.trim();if(!n)return alert("Escribe el nombre");draft.push({pid:"LIBRE",n,u:"pieza",f:1,p,q,pc:null,man:false,d});$("mn").value=""}
else{if(!sel)return alert("Elige un producto del catálogo");const x=sel.presentaciones[+$("pres").value];draft.push({pid:sel.id,n:sel.nombre,u:x.unidad,f:x.factor,p,q,pc:x.precio,man:p!==x.precio,d});sel=null;$("pick").classList.add("hide");$("pr").value="";search()}
$("qt").value=1;$("ds").value="";draw()};
let rowSel=-1;const nf=new Intl.NumberFormat("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
function tbl(items,sel){const c=calc(items);return `<div style="overflow-x:auto"><table class="x"><thead><tr><th class="c">#</th><th class="c">Cant.</th><th>Artículo</th><th class="r">P. unit.</th><th class="r">Importe</th></tr></thead><tbody>${items.length?items.map((i,k)=>`<tr${sel&&k===rowSel?' class="sl"':""} data-r="${k}"><td class="c">${k+1}</td><td class="c"><b>${i.q}</b></td><td>${esc(i.n)}${i.man?'<span class="b">PRECIO</span>':""}<br><small>${esc(i.u)}${i.d?" · "+esc(i.d):""}</small></td><td class="r">${nf.format(i.p)}</td><td class="r"><b>${nf.format(i.p*i.q)}</b></td></tr>`).join(""):'<tr><td colspan="5" class="m">Aún no hay artículos.</td></tr>'}</tbody><tfoot><tr><td colspan="4" class="r">Total de artículos</td><td class="r">${c.u}</td></tr><tr><td colspan="4" class="r">Piezas equivalentes</td><td class="r">${c.pz}</td></tr><tr class="g"><td colspan="3" class="r">TOTAL</td><td colspan="2" class="r">${mx.format(c.g)}</td></tr></tfoot></table></div>`}
function draw(){if(rowSel>=draft.length)rowSel=-1;$("items").innerHTML=tbl(draft,true)+(draft.length&&rowSel<0?'<p class="m" style="margin:6px 2px 0">Toca un renglón para cambiar cantidad, nota o quitarlo.</p>':"");$("bar").classList.toggle("hide",rowSel<0);
const b=$("ban");if(editing){b.classList.remove("hide");b.textContent="Editando "+editing.id+". Al guardar se marcará como EDITADO."}else b.classList.add("hide")}
$("items").onclick=e=>{const tr=e.target.closest("tr[data-r]");if(!tr)return;const k=+tr.dataset.r;rowSel=rowSel===k?-1:k;draw()};
$("bm").onclick=()=>{const i=draft[rowSel];if(!i)return;i.q--;if(i.q<1){draft.splice(rowSel,1);rowSel=-1}draw()};
$("bp").onclick=()=>{if(draft[rowSel]){draft[rowSel].q++;draw()}};
$("bd").onclick=()=>{const i=draft[rowSel];if(!i)return;const v=prompt("Descripción del artículo",i.d||"");if(v!==null){i.d=v.trim();draw()}};
$("bx").onclick=()=>{if(draft[rowSel]&&confirm("¿Quitar este artículo?")){draft.splice(rowSel,1);rowSel=-1;draw()}};
$("clr").onclick=()=>{draft=[];editing=null;rowSel=-1;$("desc").value="";draw()};
$("sel").oninput=()=>{S.seller=$("sel").value.trim();persist()};
$("save").onclick=()=>{const sl=$("sel").value.trim();if(!sl)return alert("Escribe el nombre del vendedor");if(!draft.length)return alert("Agrega al menos un artículo");const c=calc(draft),now=new Date().toISOString(),desc=$("desc").value.trim();
if(editing){const t=S.tickets.find(x=>x.id===editing.id);t.edits.push({at:now,by:sl,prevTotal:t.total,prevItems:t.items,prevDesc:t.desc||""});Object.assign(t,{items:draft,desc,total:c.g,units:c.u,pieces:c.pz,updated:now,edited:true,cat_v:cat.v})}
else{S.seq++;S.tickets.push({id:S.dev+"-"+String(S.seq).padStart(5,"0"),device:S.dev,deviceName:S.name,seller:sl,desc,created:now,updated:now,items:draft,total:c.g,units:c.u,pieces:c.pz,edited:false,edits:[],cat_v:cat.v})}
persist();draft=[];editing=null;rowSel=-1;$("desc").value="";draw();tab("h")};
function list(){const L=[...S.tickets].reverse();$("list").innerHTML=L.length?L.map(t=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${t.id}${t.edited?'<span class="b">EDITADO</span>':""}</b><b>${mx.format(t.total)}</b></div><small>${esc(t.seller||"Sin vendedor")} · ${new Date(t.updated).toLocaleString("es-MX")} · ${t.units} art.</small>${t.desc?`<br><small>${esc(t.desc)}</small>`:""}<div class="row" style="margin-top:8px"><button data-v="${t.id}" style="flex:1">Ver / QR</button><button data-e="${t.id}" style="flex:1">Editar</button></div></div>`).join(""):'<p class="m">Sin tickets guardados.</p>'}
$("list").onclick=e=>{const v=e.target.dataset.v,ed=e.target.dataset.e;
if(ed){const t=S.tickets.find(x=>x.id===ed);editing=t;draft=t.items.map(i=>({...i}));rowSel=-1;$("desc").value=t.desc||"";tab("n");draw()}
if(v){const t=S.tickets.find(x=>x.id===v);let qr="";try{const q=qrcode(0,"M");q.addData(JSON.stringify({id:t.id,v:t.seller||"",d:(t.desc||"").slice(0,80),t:t.updated,e:t.edited?1:0,i:t.items.map(i=>[i.pid,i.u,i.q,i.p]),g:t.total}));q.make();qr=q.createSvgTag(4)}catch(x){qr="<p class='m'>Ticket muy grande para QR</p>"}
const d=$("det"),le=t.edits.at(-1);d.classList.remove("hide");d.innerHTML=`<b>Ticket ${t.id}</b>${t.edited?'<span class="b">EDITADO</span>':""}<br><small>Vendedor: <b>${esc(t.seller||"-")}</b><br>${new Date(t.created).toLocaleString("es-MX")} · ${esc(t.deviceName)}</small><div style="margin-top:8px">${tbl(t.items,false)}</div>${t.desc?`<p style="margin:8px 0 0"><small>Notas:</small><br>${esc(t.desc)}</p>`:""}${le?`<p class="m">Ediciones: ${t.edits.length} · última ${new Date(le.at).toLocaleString("es-MX")}${le.by?" por "+esc(le.by):""}</p>`:""}<div id="qr">${qr}</div><button id="cl" style="width:100%">Cerrar</button>`;
$("cl").onclick=()=>d.classList.add("hide");d.scrollIntoView()}};
function pick(){const hoy=new Date().toDateString();return S.tickets.filter(t=>$("rng").value==="all"||new Date(t.created).toDateString()===hoy)}
function csv(){const h=["ticket_id","dispositivo_id","dispositivo","vendedor","creado","actualizado","editado","num_ediciones","descripcion_ticket","producto_id","producto","descripcion_articulo","unidad","factor_piezas","cantidad","piezas_equivalentes","precio_unitario","precio_catalogo","precio_modificado","importe","total_ticket","catalogo_v"];
const rows=[];pick().forEach(t=>t.items.forEach(i=>rows.push([t.id,t.device,t.deviceName,t.seller||"",t.created,t.updated,t.edited?"SI":"NO",t.edits.length,t.desc||"",i.pid,i.n,i.d||"",i.u,i.f,i.q,i.q*i.f,i.p,i.pc??"",i.man?"SI":"NO",r2(i.p*i.q),t.total,t.cat_v||""])));
return [h,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n")}
function fname(x){const d=new Date(),p=n=>String(n).padStart(2,"0");return `tickets_${S.dev}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.${x}`}
function mkfile(j){return j?new Blob([JSON.stringify(pick(),null,1)],{type:"application/json"}):new Blob(["\ufeff"+csv()],{type:"text/csv;charset=utf-8"})}
function dl(j){const a=document.createElement("a");a.href=URL.createObjectURL(mkfile(j));a.download=fname(j?"json":"csv");document.body.appendChild(a);a.click();a.remove()}
$("dl").onclick=()=>dl(false);$("dj").onclick=()=>dl(true);
$("sh").onclick=async()=>{const f=new File([mkfile(false)],fname("csv"),{type:"text/csv"});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Tickets"});else alert("Tu navegador no permite compartir archivos. Usa las opciones de descarga.")}catch(e){}};
$("rng").onchange=()=>$("out").value=csv();
$("cp").onclick=async()=>{const o=$("out");o.select();try{await navigator.clipboard.writeText(o.value)}catch(e){document.execCommand("copy")}$("cp").textContent="¡Copiado!";setTimeout(()=>$("cp").textContent="Copiar texto",1500)};
function tab(t){["n","h","x"].forEach(k=>$(k).classList.toggle("hide",k!==t));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("det").classList.add("hide");if(t==="h")list();if(t==="x")$("out").value=csv()}
document.querySelector(".tabs").onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t)};
load();$("sel").value=S.seller||"";$("dev").textContent=S.name+" · ID "+S.dev;draw();loadCat();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
